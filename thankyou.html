<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Message Received</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .thank-you-card {
            background: rgba(18, 18, 26, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem 3rem;
            border-radius: 40px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 10;
            animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2.5rem;
            font-size: 3.5rem;
            color: white;
            position: relative;
            animation: iconPulse 2s infinite;
        }

        .success-icon::after {
            content: '';
            position: absolute;
            inset: -10px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            animation: orbit 4s linear infinite;
        }

        @keyframes orbit {
            0% { transform: rotate(0deg); border-color: var(--accent); }
            50% { border-color: var(--accent-2); }
            100% { transform: rotate(360deg); border-color: var(--accent); }
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px 10px rgba(124, 58, 237, 0.2); }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: var(--gradient);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
        }

        .btn-home:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.4);
        }

        .btn-home i {
            transition: transform 0.3s;
        }

        .btn-home:hover i {
            transform: translateX(-5px);
        }

        /* Decorative Elements */
        .decor-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .blob-1 { top: -10%; right: -5%; animation: float 10s infinite alternate; }
        .blob-2 { bottom: -10%; left: -5%; animation: float 8s infinite alternate-reverse; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <main class="thank-you-page">
        <div class="decor-blob blob-1"></div>
        <div class="decor-blob blob-2"></div>

        <div class="thank-you-card">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1>Thank You!</h1>
            <p>Your message has been successfully received. I'll get back to you as soon as possible!</p>
            <a href="index.html" class="btn-home">
                <i class="fas fa-arrow-left"></i> Back to Portfolio
            </a>
        </div>
    </main>

    <script>
        // Simple entry animation trigger
        window.addEventListener('load', () => {
            document.querySelector('.thank-you-card').style.opacity = '1';
        });
    </script>
</body>
</html>
